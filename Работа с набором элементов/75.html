<!DOCTYPE html>
<html>
<head>
  <script src="jquery.js"></script>
</head>
<body>

  <ul>
    <li>Элемент 1</li>
    <li>Элемент 2</li>
    <li>Элемент 3</li>
    <li>Элемент 4</li>
    <li>Элемент 5</li>
  </ul>

  <script>
    // №1 — первый li → красный
    $('li').first().css('color', 'red');

    // №2 — последний li → зелёный
    $('li').last().css('color', 'green');
  </script>

</body>
</html>
