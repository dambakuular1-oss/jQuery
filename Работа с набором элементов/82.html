<!DOCTYPE html>
<html>
<head>
  <script src="jquery.js"></script>
</head>
<body>

  <ul>
    <li class="www">Элемент 1</li>
    <li>Элемент 2</li>
    <li class="test"><b>Элемент 3</b></li>
    <li><b>Элемент 4</b></li>
    <li class="test"><b>Элемент 5</b></li>
  </ul>

  <script>
    // №1 — родитель .www → красный
    $('.www').parent().css('color', 'red');

    // №2 — родители всех b → красный
    $('b').parent().css('color', 'red');

    // №3 — родители всех b, у которых класс .test → красный
    $('b').parent('.test').css('color', 'red');
  </script>

</body>
</html>
