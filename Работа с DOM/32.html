<!DOCTYPE html>
<html>
<head>
  <script src="jquery.js"></script>
</head>
<body>

  <!-- №2 -->
  <div class="www">
    <a href="https://google.com">Ссылка в www</a>
  </div>

  <!-- №3 -->
  <img src="cat.jpg" alt="кот">
  <img src="dog.jpg" alt="собака">
  <img src="bird.jpg" alt="птица">

  <!-- №4 -->
  <a href="https://google.com">Google</a>
  <a href="https://youtube.com">YouTube</a>
  <a href="https://github.com">GitHub</a>

  <script>
    // №2
    console.log($('.www a').attr('href'))

    // №3
    $('img').each(function() {
      alert($(this).attr('src'))
    })

    // №4
    $('a').each(function() {
      alert($(this).attr('href'))
    })
  </script>

</body>
</html>
