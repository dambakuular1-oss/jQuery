<!DOCTYPE html>
<html>
<head>
  <script src="jquery.js"></script>
  <style>
    .red { color: red; }
    .www { font-weight: bold; }
  </style>
</head>
<body>

  <ul>
    <li class="www">Элемент 1</li>
    <li>Элемент 2</li>
    <li class="www">Элемент 3</li>
    <li>Элемент 4</li>
  </ul>

  <script>
    $('li').each(function() {
      $(this).addClass('red').toggleClass('red')
    })
  </script>

</body>
</html>
