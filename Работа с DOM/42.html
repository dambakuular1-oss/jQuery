<!DOCTYPE html>
<html>
<head>
  <script src="jquery.js"></script>
  <style>
    .test { color: red; }
  </style>
</head>
<body>

  <ul>
    <li>Элемент 1</li>
    <li>Элемент 2</li>
    <li>Элемент 3</li>
  </ul>

  <script>
    $('li').each(function() {
      $(this).attr('class', 'test')
    })
  </script>

</body>
</html>
