<html>
<head>

  <style>
    .www { color: red; }
  </style>
</head>
<body>

  <ul>
    <li class="www">Элемент 1 (есть класс www)</li>

    <li>Элемент 4 (нет класса www)</li>

    // №1
    $('li').toggleClass('www')

    $('li').removeClass('www')
  </script>

</body>
</html>
