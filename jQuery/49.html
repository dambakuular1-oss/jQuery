<!DOCTYPE html>
<html>
<head>
  <script src="jquery.js"></script>
  <style>
    div { border: 1px solid red; margin: 5px; }
    p { border: 1px solid blue; margin: 5px; }
  </style>
</head>
<body>

  <!-- №1 -->
  <div><p>Абзац в диве — див удалится</p></div>
  <div><p>Ещё абзац в диве — див удалится</p></div>
  <p>Обычный абзац — не изменится</p>

  <!-- №2 -->
  <p><span>Span в абзаце — абзац удалится</span></p>
  <p><span>Ещё span в абзаце — абзац удалится</span></p>
  <span>Обычный span — не изменится</span>

  <script>
    // №1
    $('div > p').unwrap()

    // №2
    $('p > span').unwrap()
  </script>

</body>
</html>
