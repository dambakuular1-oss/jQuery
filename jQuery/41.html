<!DOCTYPE html>
<html>
<head>
  <script src="jquery.js"></script>
</head>
<body>

  <!-- №1 -->
  <input type="text" value="aaa">
  <input type="text" value="bbb">

  <!-- №2 -->
  <input class="number" type="text" value="2">
  <input class="number" type="text" value="3">
  <input class="number" type="text" value="4">

  <!-- №3 -->
  <input class="in" type="text" value="Привет!">

  <!-- №4 -->
  <input type="text" value="один">
  <input type="text" value="два">
  <input type="text" value="три">

  <!-- №5 -->
  <textarea class="text">Содержимое textarea</textarea>

  <script>
    // №1
    $('input').val('!')

    // №2
    $('input.number').each(function() {
      $(this).val($(this).val() ** 2)
    })

    // №3
    console.log($('input.in').val())

    // №4
    $('input').each(function() {
      console.log($(this).val())
    })

    // №5
    console.log($('textarea.text').val())
  </script>

</body>
</html>
