<!DOCTYPE html>
<html>
<head>
  <script src="jquery.js"></script>
</head>
<body>

  <!-- №1 -->
  <h2>Заголовок <i>с курсивом</i> — станет красным</h2>
  <h2>Заголовок <span><i>вложенный курсив</i></span> — станет красным</h2>
  <h2>Обычный заголовок — не изменится</h2>

  <!-- №2 -->
  <h2>Заголовок <i>с прямым курсивом</i> — станет красным</h2>
  <h2>Заголовок <span><i>вложенный курсив</i></span> — не изменится</h2>
  <h2>Обычный заголовок — не изменится</h2>

  <script>
    // №1
    $('h2:has(i)').css('color', 'red')

    // №2
    $('h2:has(> i)').css('color', 'red')
  </script>

</body>
</html>
