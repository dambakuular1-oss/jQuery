<!DOCTYPE html>
<html>
<head>
  <script src="jquery.js"></script>
</head>
<body>

  <ul>
    <li class="www test">Элемент 1</li>
    <li class="www">Элемент 2</li>
    <li class="www abc">Элемент 3</li>

    })
