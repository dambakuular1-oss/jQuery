<!DOCTYPE html>
<html>
<head>
  <script src="jquery.js"></script>
</head>
<body>

  <!-- №1 -->
  <h1>Заголовок h1 — станет красным</h1>
  <h2 class="test">Заголовок с классом test — не изменится</h2>
  <h3>Заголовок h3 — станет красным</h3>
  <h4 class="test">Заголовок с классом test — не изменится</h4>

  <!-- №2 -->
  <h2>Обычный h2 — станет красным</h2>
  <h2 class="test">h2 с классом test — не изменится</h2>
  <h2>Ещё один h2 — станет красным</h2>

  <script>
    // №1
    $(':header:not(.test)').css('color', 'red')

    // №2
    $('h2:not(.test)').css('color', 'red')
  </script>

</body>
</html>
