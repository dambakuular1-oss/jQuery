<!DOCTYPE html>
<html>
<head>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>

  <ul>
    <li>text — станет красным</li>
    <li>some text here — станет красным</li>
    <li>обычный элемент — не изменится</li>
    <li>ещё один text — станет красным</li>
  </ul>

  <script>
    $('li:contains("text")').css('color', 'red')
  </script>

</body>
</html>
